<link rel="stylesheet" href="/style.css">
<style>
  .notes-month{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--red);
    margin:36px 0 4px;
  }
  .notes-month:first-child{ margin-top:0; }
  .note-source{
    font-family:'IBM Plex Mono', monospace;
    font-size:10px;
    letter-spacing:0.04em;
    color:var(--ink-faint);
    margin-top:6px;
  }
  .note-source a{ border-bottom:1px solid var(--ink-faint); }
  .note-source a:hover{ color:var(--red); border-color:var(--red); }
  .notes-empty, .notes-loading{
    font-family:'IBM Plex Mono', monospace;
    font-size:13px;
    color:var(--ink-faint);
    padding:40px 0;
  }
</style>
</head>
<body>

<header id="site-header"></header>
<script src="/header.js"></script>

<section class="section" style="border-bottom:none; padding-bottom:0;">
  <div class="wrap">
    <div class="section-head">
      <div>
        <div class="section-num">SURVEILLANCE NOTES</div>
        <h2 class="section-title">The present, annotated</h2>
      </div>
      <div class="section-note">SHORT DISPATCHES LINKING FICTION TO THIS WEEK</div>
    </div>
  </div>
</section>

<section class="section" style="padding-top:0;">
  <div class="wrap">
    <div id="notes-root" class="notes-list">
      <div class="notes-loading">Loading records…</div>
    </div>
  </div>
</section>

<footer>
  <div class="wrap">
    <div class="footer-inner">
      <div class="footer-line">JORJOR WEL // MINISTRY OF REALITY<br>THE CANON / SURVEILLANCE NOTES / READING LISTS / ORWELL / ABOUT</div>
      <div class="footer-links">
        <a href="/lists.html">Reading Lists</a>
        <a href="/about.html">About</a>
      </div>
    </div>
    <div class="footer-quiet">Fiction warned us. This is the record of whether we listened.</div>
  </div>
</footer>

<script>
  const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];

  function escapeAttr(str){
    return String(str).replace(/"/g, "&quot;");
  }

  async function loadNotes(){
    const root = document.getElementById('notes-root');
    try{
      const res = await fetch('/data/notes.json', { cache: 'no-store' });
      if(!res.ok) throw new Error('fetch failed');
      const notes = await res.json();

      if(!Array.isArray(notes) || notes.length === 0){
        root.innerHTML = '<div class="notes-empty">No records filed yet.</div>';
        return;
      }

      // newest first
      notes.sort((a,b) => new Date(b.date) - new Date(a.date));

      let html = '';
      let lastMonthKey = '';

      notes.forEach(note => {
        const d = new Date(note.date + 'T00:00:00');
        const monthKey = d.getFullYear() + '-' + d.getMonth();
        if(monthKey !== lastMonthKey){
          html += `<div class="notes-month">${MONTHS[d.getMonth()]} ${d.getFullYear()}</div>`;
          lastMonthKey = monthKey;
        }

        const dd = String(d.getDate()).padStart(2,'0');
        const mm = String(d.getMonth()+1).padStart(2,'0');
        const yy = String(d.getFullYear()).slice(2);
        const dateLabel = `${dd}.${mm}.${yy}`;

        const sourceHtml = note.source_url
          ? `<div class="note-source"><a href="${escapeAttr(note.source_url)}" target="_blank" rel="noopener">${note.source_name || 'Source'} ↗</a></div>`
          : '';

        html += `
          <div class="note-row">
            <div class="note-date">${dateLabel}</div>
            <div><div class="note-text">${note.text}</div>${sourceHtml}</div>
            <div class="note-tag">${note.tag || ''}</div>
          </div>`;
      });

      root.innerHTML = html;
    }catch(err){
      root.innerHTML = '<div class="notes-empty">The record could not be retrieved.</div>';
    }
  }

  loadNotes();
</script>

</body>
</html>
