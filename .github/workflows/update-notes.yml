name: Update Surveillance Notes

on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch: {}

jobs:
  update-notes:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Run notes pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npm run update-notes

      - name: Commit and push if changed
        run: |
          git config user.name "jorjorwel-bot"
          git config user.email "actions@github.com"
          git add data/notes.json
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "Auto-update: new Surveillance Notes entries"
          git push
